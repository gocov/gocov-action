name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Windows' default pwsh mangles `-coverprofile=coverage.out`; use bash
# everywhere.
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh upload.sh

  # Dogfooding: generate a real coverage profile from selftest/ and upload
  # it to the hosted service with the action itself — a live integration
  # test on every runner OS we claim to support. Upload steps are skipped
  # on forks, where the GOCOV_TOKEN secret isn't available.
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # secrets isn't available in step-level `if`, so surface the check here.
      HAVE_GOCOV_TOKEN: ${{ secrets.GOCOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Generate coverage
        working-directory: selftest
        run: go test -coverprofile=coverage.out ./...

      # TODO: add `part: ${{ matrix.os }}` once the pinned CLI supports
      # multi-part uploads (gocov/gocov PR#25); v0.8.3 doesn't yet.
      - name: Upload with the action
        if: ${{ env.HAVE_GOCOV_TOKEN == 'true' }}
        uses: ./
        with:
          files: selftest/coverage.out
          token: ${{ secrets.GOCOV_TOKEN }}
