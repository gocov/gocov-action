name: tag-on-release-merge

# The merge half of the cross-repo bump: a gocov release opens a bump PR
# here carrying the `release` label, and merging that PR is the release
# decision — so this tags the merge commit with the version the PR's
# CHANGELOG.md entry names and runs the release workflow. The tag is pushed with GITHUB_TOKEN, which starts no
# workflow runs, so release.yml is called directly rather than trusting
# the tag event (the same pattern gocov's release-please path uses).
#
# Only PRs actually labeled `release` do any of this; every other merge
# is ignored.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  tag:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Read the version CHANGELOG.md releases
        id: next
        # The newest `## X.Y.Z` heading is the release, as in upload-pipe
        # and gitlab-component: the bump PR writes it, and the tag is that
        # version with the v every action tag carries.
        run: |
          version=$(sed -n 's/^## \([0-9][0-9.]*\) *$/\1/p' CHANGELOG.md | head -1)
          [ -n "$version" ] || { echo "no '## X.Y.Z' heading in CHANGELOG.md" >&2; exit 1; }
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tag $tag already exists — did the bump PR forget its CHANGELOG entry?" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag"

      - name: Tag the merge commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.next.outputs.tag }}" "${{ github.event.pull_request.merge_commit_sha }}"
          git push origin "refs/tags/${{ steps.next.outputs.tag }}"

  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
