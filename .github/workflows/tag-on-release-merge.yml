name: tag-on-release-merge

# The merge half of the cross-repo bump: a gocov release opens a bump PR
# here carrying the `release` label, and merging that PR is the release
# decision — so this tags the next minor on the merge commit and runs the
# release workflow. The tag is pushed with GITHUB_TOKEN, which starts no
# workflow runs, so release.yml is called directly rather than trusting
# the tag event (the same pattern gocov's release-please path uses).
#
# Only PRs actually labeled `release` do any of this; every other merge
# is ignored.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  tag:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Compute the next minor
        id: next
        # The action's version lives nowhere in the tree — a CLI bump has
        # always been a minor release, so the next version is derived from
        # the newest existing tag.
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          [ -n "$latest" ] || { echo "no existing release tags found" >&2; exit 1; }
          major=${latest%%.*}
          rest=${latest#*.}
          tag="$major.$(( ${rest%%.*} + 1 )).0"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag (latest was $latest)"

      - name: Tag the merge commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.next.outputs.tag }}" "${{ github.event.pull_request.merge_commit_sha }}"
          git push origin "refs/tags/${{ steps.next.outputs.tag }}"

  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
