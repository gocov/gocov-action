name: release

# On a semver tag push (v1.2.3): create the GitHub release and move the
# floating major tag (v1) to it, which is what `uses: gocov/gocov-action@v1`
# resolves. The first release is published to the Marketplace manually by
# ticking "Publish this Action to the GitHub Marketplace" on the release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Move major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$GITHUB_REF_NAME"
          git push -f origin "$major"
