name: release

# On a semver tag push (v1.2.3): create the GitHub release and move the
# floating major tag (v1) to it, which is what `uses: gocov/gocov-action@v1`
# resolves. The first release is published to the Marketplace manually by
# ticking "Publish this Action to the GitHub Marketplace" on the release.
#
# Also callable with an explicit tag: tag-on-release-merge.yml pushes its
# tag with GITHUB_TOKEN, and GitHub starts no workflow runs from those
# pushes — so it calls this workflow directly instead of relying on the
# tag event. The push trigger stays as the hand-cut escape hatch.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_call:
    inputs:
      tag:
        description: The existing tag to release.
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes

      - name: Move major tag
        run: |
          major="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$TAG"
          git push -f origin "$major"
