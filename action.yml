# Composite action (not Docker): downloads the pinned gocov CLI release
# binary, verifies its sha256 against the release's checksums.txt, and runs
# `gocov upload`. Repo/commit/branch/PR detection lives in the CLI, which
# reads the GitHub Actions environment — this action only installs and runs.
name: gocov coverage upload
author: gocov
description: >-
  Upload test coverage (Go, JS/TS, Java, Python & more) to gocov — PR diff
  coverage, commit statuses and badges, hosted or self-hosted.
branding:
  # Marketplace only offers fixed colors; green is the closest to the
  # landing page's teal.
  icon: upload-cloud
  color: green

inputs:
  files:
    description: >-
      Coverage profile file(s) to upload. Comma-separated, globs allowed
      (e.g. "coverage.out" or "cover/*.out").
    required: true
  token:
    description: >-
      gocov upload token for the repo. Store it as a repository secret
      (GOCOV_TOKEN) and pass it via the secrets context. Optional when the
      job can upload without one: grant `permissions: id-token: write` and
      the upload goes via OIDC (a signed identity token the server verifies)
      on your own push and same-repo PR builds; on fork pull_request runs the
      empty secret goes tokenless, verified through the repo's gocov GitHub
      App installation. Neither ever fails the build.
    required: false
    default: ""
  part:
    description: >-
      Label for this upload when a build's coverage is split across matrix
      jobs (e.g. "backend", "frontend", "e2e"); the server merges the parts
      uploaded for the same commit into one report.
    required: false
    default: ""
  ignore:
    description: >-
      Glob patterns for files to leave out of the report, on top of the
      repo's own ignore settings — comma-separated or one per line (e.g.
      "cmd/preview/**,*_mock.go"). Needs a gocov CLI of v0.17.0 or later.
    required: false
    default: ""
  server:
    description: gocov server URL. Override when self-hosting.
    required: false
    default: https://app.gocov.dev
  fail-on-error:
    description: >-
      Fail the workflow when installing the CLI or uploading fails. Set
      "false" to emit a warning instead.
    required: false
    default: "true"
  version:
    description: >-
      gocov CLI version to download, as a gocov/gocov release tag. The
      default is the version this action release was tested against.
    required: false
    default: v0.17.0

runs:
  using: composite
  steps:
    # Inputs are passed via env, never interpolated into the script text,
    # so input values cannot inject shell.
    - name: Install gocov CLI
      shell: bash
      env:
        GOCOV_VERSION: ${{ inputs.version }}
        GOCOV_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"

    - name: Upload coverage
      shell: bash
      env:
        GOCOV_FILES: ${{ inputs.files }}
        GOCOV_TOKEN: ${{ inputs.token }}
        GOCOV_SERVER: ${{ inputs.server }}
        GOCOV_PART: ${{ inputs.part }}
        # Not GOCOV_IGNORE: the CLI reads that name itself, and a workflow
        # may set it at job level instead of the input. A step env of ""
        # would shadow it, so the input travels under its own name and
        # upload.sh turns it into -ignore only when it is set.
        GOCOV_INPUT_IGNORE: ${{ inputs.ignore }}
        GOCOV_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        # Marks uploads as coming from the action (vs the bare CLI) so the
        # upload page's provenance shows "Action". Honored by gocov CLI
        # v0.11.0+; older CLIs ignore it.
        GOCOV_UPLOADER_KIND: action
      run: bash "$GITHUB_ACTION_PATH/upload.sh"
